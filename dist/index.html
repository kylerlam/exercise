<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f8fa"><meta name="description" content="Exercise — your private strength and cardio training journal.">
  <link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/themes.css"><link rel="stylesheet" href="/account.css"><link rel="stylesheet" href="/exercise.css"><title data-i18n="documentTitle">Exercise · 健身足迹</title>
</head>
<body>
  <header class="topbar"><a class="brand" href="#calendar" data-i18n-aria-label="homeLabel"><img src="/logo.svg" alt="Exercise" width="151" height="44"></a><p class="tagline" data-i18n="tagline">每一次训练，都值得记录。</p><button class="button primary" id="new-record"><span data-icon="plus"></span><span data-i18n="newRecord">新增记录</span></button><button class="icon-button settings-trigger" id="open-settings" type="button" data-i18n-aria-label="settings" data-i18n-title="settings"><span data-icon="settings"></span></button></header>
  <div class="app-shell"><aside class="sidebar"><nav class="navigation" data-i18n-aria-label="navigationLabel"><a class="nav-item" href="#records" data-view="records"><span data-icon="list"></span><span data-i18n="records">每日记录</span></a><a class="nav-item" href="#exercises" data-view="exercises"><span data-icon="strength"></span><span data-i18n="exercises">常用动作</span></a><a class="nav-item" href="#calendar" data-view="calendar"><span data-icon="calendar"></span><span data-i18n="calendar">日历</span></a><a class="nav-item" href="#monthly" data-view="monthly"><span data-icon="chart"></span><span data-i18n="monthly">月统计</span></a></nav><button class="export-link" type="button" id="open-export"><span data-icon="export"></span><span data-i18n="exportData">导出数据</span></button></aside>
  <main id="main" tabindex="-1"><div class="page-heading"><h1 id="page-title">日历</h1><p id="page-subtitle"></p></div><div class="error-banner" id="page-error" role="alert" hidden><span></span><button id="retry-load" type="button" data-i18n="retry">重试</button></div><p id="loading-state" class="loading-state" role="status" data-i18n="loading">加载中…</p>
    <section id="calendar-view" class="calendar-workspace" hidden>
      <div class="panel calendar-panel"><div class="month-toolbar"><label class="month-picker" data-i18n-title="chooseMonth"><span id="month-label"></span><input type="month" id="month-input" min="1900-01" max="9998-12" data-i18n-aria-label="chooseMonth"></label><div class="month-controls"><button class="icon-button" id="previous-month" data-i18n-aria-label="previousMonth"><span data-icon="left"></span></button><button class="button today-button" id="calendar-today" data-i18n="today">今天</button><button class="icon-button" id="next-month" data-i18n-aria-label="nextMonth"><span data-icon="right"></span></button></div></div><div class="weekdays" id="weekdays" aria-hidden="true"></div><div id="calendar-grid" class="calendar-grid" data-i18n-aria-label="chooseDate"></div><div class="calendar-legend"><span><i class="activity-dot strength-dot"></i><span data-i18n="strength">力量训练</span></span><span><i class="activity-dot cardio-dot"></i><span data-i18n="cardio">有氧运动</span></span></div></div>
      <section class="panel day-panel" aria-labelledby="day-title"><div class="day-header"><div class="day-title-row"><h2 id="day-title"></h2><button class="icon-button" id="day-add" data-i18n-aria-label="newRecord"><span data-icon="plus"></span></button></div><p id="day-summary" aria-live="polite"></p></div><div id="day-list" class="task-list"></div><p class="panel-footer" data-i18n="dayFooter">每一次训练，都在这里留下足迹。</p></section>
    </section>
    <section id="records-view" hidden><div class="panel records-panel"><div class="record-toolbar"><label class="date-picker"><span class="sr-only" data-i18n="chooseDate">选择日期</span><input id="record-date" type="date" min="1900-01-01" max="9998-12-31" data-i18n-aria-label="chooseDate"></label><div class="month-controls"><button class="icon-button" id="previous-day" data-i18n-aria-label="previousDay"><span data-icon="left"></span></button><button class="button today-button" id="records-today" data-i18n="today">今天</button><button class="icon-button" id="next-day" data-i18n-aria-label="nextDay"><span data-icon="right"></span></button></div></div><div class="record-section-heading"><h2 data-i18n="strength">力量训练</h2><button class="button compact-button" id="add-strength"><span data-icon="plus"></span><span data-i18n="addStrength">添加力量训练</span></button></div><div id="strength-list"></div><div class="record-section-heading cardio-section-heading"><h2 data-i18n="cardio">有氧运动</h2><button class="button compact-button" id="add-cardio"><span data-icon="plus"></span><span data-i18n="addCardio">添加有氧运动</span></button></div><div id="cardio-list"></div><p class="panel-footer" data-i18n="strengthHint">横向顺序：部位 → 动作 → 组数 → 每组次数。组数、次数必须为正整数。</p></div></section>
    <section id="exercises-view" hidden><div class="panel exercises-panel"><form id="exercise-form" class="exercise-form" novalidate><label class="field"><span class="field-label" data-i18n="type">训练类型</span><select id="exercise-type"><option value="strength" data-i18n="strength">力量训练</option><option value="cardio" data-i18n="cardio">有氧运动</option></select></label><label class="field" id="exercise-body-field"><span class="field-label" data-i18n="bodyPart">部位</span><input id="exercise-body" maxlength="60" autocomplete="off" list="body-part-options" data-i18n-placeholder="bodyPlaceholder"></label><label class="field"><span class="field-label" data-i18n="exercise">动作</span><input id="exercise-name" maxlength="100" autocomplete="off" data-i18n-placeholder="exercisePlaceholder"></label><button class="button primary" type="submit" id="add-exercise"><span data-icon="plus"></span><span data-i18n="addExercise">添加动作</span></button></form><p class="form-error exercise-error" id="exercise-error" role="alert" hidden></p><div id="exercise-library"></div><p class="panel-footer" data-i18n="exercisesHint">新增训练记录时，可直接从这里选择动作，部位和名称会自动填好。</p></div></section>
    <section id="monthly-view" hidden><div class="summary-grid" id="month-stats"></div><div class="panel monthly-panel"><div class="month-toolbar"><div><h2 data-i18n="monthlyTitle">每月训练记录表</h2><label class="month-picker monthly-picker"><span id="monthly-month-label"></span><input type="month" id="monthly-month-input" min="1900-01" max="9998-12" data-i18n-aria-label="chooseMonth"></label></div><div class="month-controls"><button class="icon-button" id="monthly-previous" data-i18n-aria-label="previousMonth"><span data-icon="left"></span></button><button class="button today-button" id="monthly-today" data-i18n="today">今天</button><button class="icon-button" id="monthly-next" data-i18n-aria-label="nextMonth"><span data-icon="right"></span></button></div></div><p class="monthly-hint" data-i18n="monthHint"></p><table class="monthly-table"><thead><tr><th scope="col" data-i18n="day">日期</th><th scope="col" data-i18n="trainingRecord">训练记录</th></tr></thead><tbody id="monthly-body"></tbody></table></div></section>
    <button class="mobile-export" id="mobile-export" type="button"><span data-icon="export"></span><span data-i18n="exportData">导出数据</span></button><noscript><p class="error-banner">Please enable JavaScript to use Exercise.</p></noscript>
  </main></div>
  <dialog id="record-dialog" class="record-dialog" aria-labelledby="record-dialog-title"><form id="record-form"><div class="dialog-heading"><h2 id="record-dialog-title" data-i18n="newRecord">新增记录</h2><button class="icon-button" type="button" id="close-record" data-i18n-aria-label="closeDialog"><span data-icon="close"></span></button></div><div class="record-form-top"><label class="field"><span data-i18n="day">日期</span><input type="date" id="entry-day" name="day" min="1900-01-01" max="9998-12-31" required></label><label class="field"><span data-i18n="type">训练类型</span><select id="entry-type" name="type"><option value="strength" data-i18n="strength">力量训练</option><option value="cardio" data-i18n="cardio">有氧运动</option></select></label></div><label class="field preset-field"><span class="field-label" data-i18n="choosePreset">从常用动作选择</span><select id="entry-preset"></select></label>
    <div id="strength-fields"><div class="strength-fields"><label class="field"><span class="field-label" data-i18n="bodyPart">部位</span><input id="entry-body" name="bodyPart" maxlength="60" required autocomplete="off" list="body-part-options" data-i18n-placeholder="bodyPlaceholder"></label><label class="field"><span class="field-label" data-i18n="exercise">动作</span><input id="entry-exercise" name="exercise" maxlength="100" required autocomplete="off" data-i18n-placeholder="exercisePlaceholder"></label><label class="field"><span class="field-label" data-i18n="weight">重量 (kg)</span><input id="entry-weight" name="weight" type="number" inputmode="decimal" min="0.01" max="10000" step="any" autocomplete="off"></label><label class="field"><span class="field-label" data-i18n="sets">组数</span><input id="entry-sets" name="sets" type="number" inputmode="numeric" min="1" max="10000" step="1" required></label><label class="field"><span class="field-label" data-i18n="reps">次数</span><input id="entry-reps" name="reps" type="number" inputmode="numeric" min="1" max="10000" step="1" required aria-describedby="strength-hint"></label></div><p class="field-hint" id="strength-hint" data-i18n="strengthHint"></p></div>
    <div id="cardio-fields" hidden><div class="cardio-fields"><label class="field"><span class="field-label" data-i18n="exercise">动作</span><input id="entry-cardio-exercise" maxlength="100" autocomplete="off" data-i18n-placeholder="cardioPlaceholder"></label><label class="field"><span class="field-label" data-i18n="duration">时长（分钟）</span><input id="entry-duration" type="number" inputmode="decimal" min="0.01" max="10080" step="any"></label><label class="field"><span class="field-label"><span data-i18n="distance">距离（公里）</span> <span class="optional" data-i18n="optional">选填</span></span><input id="entry-distance" type="number" inputmode="decimal" min="0.001" max="100000" step="any"></label></div><p class="field-hint" data-i18n="cardioHint"></p></div>
    <label class="field"><span class="field-label"><span data-i18n="notes">备注</span> <span class="optional" data-i18n="optional">选填</span></span><textarea id="entry-notes" name="notes" rows="3" maxlength="2000" data-i18n-placeholder="notesPlaceholder"></textarea></label><p class="form-error" id="record-error" role="alert" hidden></p><a class="button" id="record-reauth" href="/login.html" target="_blank" rel="noopener" data-i18n="signInNewTab" hidden>在新标签页登录</a><div class="dialog-actions"><button class="button" type="button" id="cancel-record" data-i18n="cancel">取消</button><button class="button primary" type="submit" id="save-record" data-i18n="saveRecord">保存记录</button></div></form></dialog>
  <dialog id="delete-dialog" aria-labelledby="delete-title"><div class="dialog-heading"><h2 id="delete-title" data-i18n="deleteTitle">删除这条记录？</h2></div><p id="delete-record-name" class="task-title"></p><p class="discard-description" data-i18n="deleteDescription"></p><p class="form-error" id="delete-error" role="alert" hidden></p><div class="dialog-actions"><button class="button" id="keep-record" data-i18n="keepRecord">保留记录</button><button class="button primary" id="confirm-delete" data-i18n="deleteRecord">删除记录</button></div></dialog>
  <datalist id="body-part-options"></datalist>
  <div class="toast" id="toast" role="status" hidden></div><script type="module" src="/app.js"></script>
</body></html>
