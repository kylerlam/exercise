name: exercise
services:
  app:
    image: exercise:v0.1.7
    platform: linux/amd64
    container_name: exercise-app
    ports:
      - "${EXERCISE_BIND_HOST:-127.0.0.1}:4186:8080"
    environment:
      TZ: Asia/Hong_Kong
      SESSION_COOKIE_SECURE: "true"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
